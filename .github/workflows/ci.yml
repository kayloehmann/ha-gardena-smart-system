name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check custom_components/ tests/
          src: "."
      - uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check custom_components/ tests/
          src: "."

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ./aiogardenasmart -e ./aioautomower
          pip install gardena-smart-local-api==0.0.11
          pip install pytest pytest-asyncio pytest-cov pytest-homeassistant-custom-component

      - name: Run tests
        run: pytest --cov --cov-report=xml -q

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lib-version-check:
    name: Library version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check aiogardenasmart version is in sync
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          lib_version = tomllib.loads(
              pathlib.Path("aiogardenasmart/pyproject.toml").read_text()
          )["project"]["version"]

          manifest = json.loads(
              pathlib.Path("custom_components/gardena_smart_system_ng/manifest.json").read_text()
          )
          reqs = [r for r in manifest["requirements"] if r.startswith("aiogardenasmart")]
          manifest_version = reqs[0].split("==")[1] if reqs else ""

          print(f"Library version:  {lib_version}")
          print(f"Manifest requires: {manifest_version}")
          if lib_version != manifest_version:
              print(f"::error::aiogardenasmart version mismatch: "
                    f"pyproject.toml={lib_version}, manifest.json={manifest_version}")
              sys.exit(1)
          print("OK — versions match")
          PYEOF

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e ./aiogardenasmart -e ./aioautomower
          pip install mypy pytest-homeassistant-custom-component

      - name: Run mypy
        run: mypy custom_components/gardena_smart_system_ng/
