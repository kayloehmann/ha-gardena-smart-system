name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check custom_components/ tests/
          src: "."
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check custom_components/ tests/
          src: "."

  libs:
    # The vendored libraries ship their own test-suites, but the root pytest run
    # cannot see them (`testpaths = ["tests"]`), and the lint/mypy jobs above are
    # scoped to `custom_components/` + `tests/`. They were therefore completely
    # unverified in CI — this job closes that gap. Each library is checked in a
    # clean environment, exactly as a downstream consumer would install it from
    # PyPI, and NOT inside the Home Assistant test environment (whose pinned
    # dependency set would mask what a standalone install actually resolves).
    name: Vendored library (${{ matrix.lib }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib: [aiogardenasmart, aiohusqvarna]
    defaults:
      run:
        working-directory: ${{ matrix.lib }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: .
        # `aiohusqvarna` depends on `aiogardenasmart`. Install both from the tree
        # so we test the source we are about to ship — never a release that pip
        # would otherwise pull from PyPI.
        run: |
          pip install -e ./aiogardenasmart -e ./aiohusqvarna
          pip install -e "./${{ matrix.lib }}[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run mypy
        run: mypy src/

      - name: Run tests
        run: pytest -q

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ./aiogardenasmart -e ./aiohusqvarna
          pip install gardena-smart-local-api==0.0.11
          pip install pytest pytest-asyncio pytest-cov pytest-homeassistant-custom-component

      - name: Run tests
        run: pytest --cov --cov-report=xml -q

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lib-version-check:
    name: Library version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check vendored library versions are in sync with the manifest
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          # Every library we vendor in-tree must be pinned in the manifest at
          # exactly the version we ship — otherwise Home Assistant installs a
          # different build from PyPI than the one CI tested against.
          manifest = json.loads(
              pathlib.Path("custom_components/gardena_smart_system_ng/manifest.json").read_text()
          )

          failed = False
          for lib in ("aiogardenasmart", "aiohusqvarna"):
              lib_version = tomllib.loads(
                  pathlib.Path(f"{lib}/pyproject.toml").read_text()
              )["project"]["version"]

              reqs = [r for r in manifest["requirements"] if r.startswith(f"{lib}==")]
              manifest_version = reqs[0].split("==")[1] if reqs else ""

              print(f"{lib}: pyproject={lib_version} manifest={manifest_version or '<missing>'}")
              if not reqs:
                  print(f"::error::{lib} is vendored but not listed in manifest.json requirements")
                  failed = True
              elif lib_version != manifest_version:
                  print(f"::error::{lib} version mismatch: "
                        f"pyproject.toml={lib_version}, manifest.json={manifest_version}")
                  failed = True

          if failed:
              sys.exit(1)
          print("OK — versions match")
          PYEOF

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e ./aiogardenasmart -e ./aiohusqvarna
          pip install mypy pytest-homeassistant-custom-component

      - name: Run mypy
        run: mypy custom_components/gardena_smart_system_ng/
