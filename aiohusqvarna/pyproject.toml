[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiohusqvarna"
version = "0.1.0"
description = "Async Python client for the Husqvarna Automower Connect API v1"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = ["husqvarna", "automower", "gardena", "homeassistant", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.13.3",
    "aiogardenasmart>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/kayloehmann/ha-gardena-smart-system"
Source = "https://github.com/kayloehmann/ha-gardena-smart-system/tree/main/aiohusqvarna"
Issues = "https://github.com/kayloehmann/ha-gardena-smart-system/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "aioresponses>=0.7.9",
    "mypy>=2.2.0",
    "ruff>=0.15.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiohusqvarna"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
