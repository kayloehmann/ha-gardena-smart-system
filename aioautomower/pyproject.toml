[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aioautomower"
version = "0.1.0"
description = "Async Python client for the Husqvarna Automower Connect API v1"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "aiogardenasmart>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "aioresponses>=0.7.8",
    "mypy>=2.1.0",
    "ruff>=0.15.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aioautomower"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
