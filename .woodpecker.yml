when:
  - event: [push, pull_request, manual]

steps:
  quality:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    environment:
      CAIO_IMPL: thread
    commands:
      - uv pip install --system --no-cache -e ./aiogardenasmart -e ./aiohusqvarna ruff mypy pytest pytest-asyncio pytest-cov pytest-homeassistant-custom-component gardena-smart-local-api==0.0.11
      - ruff check custom_components/ tests/ aiogardenasmart/ aiohusqvarna/
      - ruff format --check custom_components/ tests/ aiogardenasmart/ aiohusqvarna/
      - mypy custom_components/gardena_smart_system_ng/
      - pytest -q
